# Consumer map: which consumer relies on which provider endpoint, which responses and
# fields it depends on, and which consumer-contributed examples capture that reliance.
#
# NOTE: this is OUR governance file. Specmatic does not read it. Specmatic uses the specs
# and the *_examples folders; this file tells humans (and later scripts) who is affected
# when a provider spec changes, and who owns each example.
version: 1

services:
  well-registry-service:
    app: app-a-production
    spec: specs/app-a-production/well-registry-service.yaml
  production-forecast-service:
    app: app-a-production
    spec: specs/app-a-production/production-forecast-service.yaml
  change-request-service:
    app: app-b-change-mgmt
    spec: specs/app-b-change-mgmt/change-request-service.yaml
  approval-service:
    app: app-b-change-mgmt
    spec: specs/app-b-change-mgmt/approval-service.yaml

interactions:
  - id: C1
    consumer: production-forecast-service
    provider: well-registry-service
    scope: intra-app
    operation: GET /wells/{wellId}
    triggeredBy: POST /forecasts
    responsesUsed: [200, 404]
    fieldsUsed: [id, name, status, dailyCapacityBbl]
    examples:
      - specs/app-a-production/well-registry-service_examples/production-forecast__get_well_W-001_active.json
      - specs/app-a-production/well-registry-service_examples/production-forecast__get_well_W-003_shut_in.json
      - specs/app-a-production/well-registry-service_examples/production-forecast__get_well_W-999_not_found.json

  - id: C2
    consumer: change-request-service
    provider: approval-service
    scope: intra-app
    operation: POST /approvals
    triggeredBy: POST /change-requests
    responsesUsed: [201]
    fieldsSent: [changeRequestId, type, capacityDeltaBbl]
    fieldsUsed: [id, decision, reason]
    examples:
      - specs/app-b-change-mgmt/approval-service_examples/change-request__approve_small_change.json
      - specs/app-b-change-mgmt/approval-service_examples/change-request__reject_large_change.json

  - id: C3
    consumer: change-request-service
    provider: production-forecast-service
    scope: cross-app          # App B -> App A
    operation: GET /forecasts/{forecastId}
    triggeredBy: POST /change-requests (only when forecastId is given)
    responsesUsed: [200, 404]
    fieldsUsed: [id, wellId]
    examples:
      - specs/app-a-production/production-forecast-service_examples/change-request__get_forecast_F-5001.json
      - specs/app-a-production/production-forecast-service_examples/change-request__get_forecast_F-9999_not_found.json

  - id: C5
    consumer: well-mfe            # Angular micro-frontend (browser), added in v1.2
    provider: well-registry-service
    scope: frontend-to-backend
    operation: GET /wells
    query: { status: optional }
    triggeredBy: page load (status from the page URL)
    responsesUsed: [200, 400]
    fieldsUsed: [id, name, field, status, dailyCapacityBbl]
    examples:
      - specs/app-a-production/well-registry-service_examples/well-mfe__list_all_wells.json
      - specs/app-a-production/well-registry-service_examples/well-mfe__list_abandoned_empty.json

  - id: C4
    consumer: production-forecast-service
    provider: change-request-service
    scope: cross-app          # App A -> App B
    operation: GET /change-requests
    query: { wellId: required-by-consumer, status: APPROVED }
    triggeredBy: POST /forecasts
    responsesUsed: [200]
    fieldsUsed: [id, wellId, status, capacityDeltaBbl]
    examples:
      - specs/app-b-change-mgmt/change-request-service_examples/production-forecast__list_approved_W-001.json
      - specs/app-b-change-mgmt/change-request-service_examples/production-forecast__list_approved_W-002_empty.json
