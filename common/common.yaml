openapi: 3.0.3
info:
  title: Shared components
  version: 1.0.0
  description: >
    Schemas and responses shared by every service spec. Referenced with
    external $ref, e.g. '../../common/common.yaml#/components/responses/NotFound'.
paths: {}
components:
  schemas:
    ProblemDetails:
      type: object
      description: >
        RFC 9457 problem details. `errors` is only present for field validation
        failures; a malformed body (e.g. a string where a number is expected)
        returns a ProblemDetails without `errors`.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: object
          description: Field name -> list of messages.
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    BadRequest:
      description: Validation failed or the request was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: A downstream provider was unavailable or returned an unexpected response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
